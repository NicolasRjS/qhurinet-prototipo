    <text x="216" y="556">RECOJOS</text>
    <text x="384" y="556">CHATS</text>
    <text x="504" y="556">PUNTOS</text>
    <text x="648" y="556">PERFIL</text>
    <text x="780" y="556">SOPORTE</text>
  </g>
  <rect x="96" y="572" width="1008" height="2" fill="#2f4a38"/>
